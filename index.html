<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiet Night City</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p>an arrangement of pictures</p>
    <h1>Quiet Night City</h1>
  </header>

  <main id="city-scene">
    <img src="images/sky.jpeg" class="photo" id="sky" alt="Clouds above a dark hillside">
    <img src="images/new-haven.jpeg" class="photo" id="skyline" alt="A distant city skyline">
    <img src="images/lights-at-night.jpeg" class="photo" id="city-lights" alt="City lights glowing at night">
    <img src="images/suburban-street.jpeg" class="photo" id="street" alt="A quiet residential street">
    <img src="images/archway.jpeg" class="photo" id="archway" alt="A stone archway opening onto a path">
    <img src="images/bicycle.jpeg" class="photo" id="bicycle" alt="A bicycle moving through a city street">
    <img src="images/walking-on-campus.jpeg" class="photo" id="walkers" alt="People walking together">
    <img src="images/ocean-2.jpeg" class="photo" id="water" alt="A figure looking across the water">

    
    <span id="moon" aria-hidden="true"></span>
  </main>

  <footer>
    <p>A quiet city.</p>
  </footer>
</body>
</html>
